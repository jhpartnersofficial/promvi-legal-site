<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PROMVI</title><style>:root{--accent:#1A66FF;--text:#111;--muted:#555;--line:#e6e8ec;--bg:#fff;--soft:#f5f7fb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-top:14px;padding-bottom:14px}
.brand{font-weight:800;letter-spacing:.08em;color:var(--text);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1}
nav a,.lang{color:var(--muted);text-decoration:none;font-size:.92rem;padding:6px 0}
nav a[aria-current=page]{color:var(--accent);font-weight:600}
.lang{margin-left:auto}
a{color:var(--accent)}
main{padding-top:28px;padding-bottom:56px}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .5em}
h2{font-size:1.35rem;margin:1.8em 0 .5em}
h3{font-size:1.1rem;margin:1.5em 0 .3em}
p{margin:.7em 0}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
code{background:var(--soft);padding:.1em .35em;border-radius:4px;font-size:.92em}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
blockquote.status{margin:1em 0;padding:12px 14px;background:var(--soft);border-left:3px solid var(--accent);border-radius:4px;color:var(--muted)}
.table{overflow-x:auto;margin:1em 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
mark.open{background:#fff3cd;color:#5c4300;padding:0 .2em;border-radius:3px}
.blocked{background:#fff3cd;color:#5c4300;border-bottom:1px solid #f1d98a}
.blocked .wrap{padding-top:12px;padding-bottom:12px;font-size:.95rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{padding-top:18px;padding-bottom:28px}
@media(max-width:520px){h1{font-size:1.65rem}.lang{margin-left:0}}

.skip { position: absolute; left: -999px; top: 0; background: #fff; color: #000; padding: 8px 12px; z-index: 10; }
.skip:focus { left: 8px; top: 8px; }
</style></head><body><main class="wrap"><h1>PROMVI</h1><ul><li><a href="en/privacy.html">English</a></li><li><a href="ko/privacy.html">한국어</a></li></ul></main></body></html>
